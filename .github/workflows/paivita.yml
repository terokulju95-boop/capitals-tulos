name: Päivitä Capitalsin tulos

on:
  schedule:
    # Puolen tunnin välein klo 5.00–10.00 Suomen aikaa joka päivä.
    # GitHubin ajastukset voivat joskus myöhästyä muutamia minuutteja.
    - cron: "0,30 5-9 * * *"
      timezone: "Europe/Helsinki"
    - cron: "0 10 * * *"
      timezone: "Europe/Helsinki"
  workflow_dispatch: # sovelluksen "Hae tulos" -nappi ja Actions-välilehden Run workflow

permissions:
  contents: write

# Jos hakuja käynnistyy useita peräkkäin, ne jonottavat eivätkä riitele keskenään.
concurrency:
  group: paivita
  cancel-in-progress: false

jobs:
  paivita:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/paivita.mjs
      - name: Tallenna muutos repoon
        run: |
          if git diff --quiet; then
            echo "Ei muutoksia."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tulos.json
          git commit -m "Päivitä ottelun tulos"
          git push
