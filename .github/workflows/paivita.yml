name: Päivitä Capitalsin tulos

on:
  schedule:
    # Puolen tunnin välein klo 5.00–10.00 Suomen aikaa joka päivä.
    # GitHubin ajastukset voivat joskus myöhästyä muutamia minuutteja.
    - cron: "0,30 5-9 * * *"
      timezone: "Europe/Helsinki"
    - cron: "0 10 * * *"
      timezone: "Europe/Helsinki"
  workflow_dispatch: # sovelluksen "Hae tulos" -nappi ja Actions-välilehden Run workflow

permissions:
  contents: write

# Jos hakuja käynnistyy useita peräkkäin, ne jonottavat eivätkä riitele keskenään.
concurrency:
  group: paivita
  cancel-in-progress: false

jobs:
  paivita:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Hae tulos ja tallenna repoon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Jos GitHub on hetkellisesti häiriössä tai toinen haku ehti tallentaa ensin,
          # yritetään uudelleen enintään neljä kertaa (odotus 10 s, 20 s ja 30 s).
          for yritys in 1 2 3 4; do
            if [ "$yritys" -gt 1 ]; then
              echo "Yritetään uudelleen ($yritys/4)…"
              sleep $(( (yritys - 1) * 10 ))
            fi

            # Aloitetaan aina repon tuoreimmasta versiosta
            git fetch origin main || continue
            git reset --hard origin/main

            node scripts/paivita.mjs
            git add data/tulos.json
            if git diff --cached --quiet; then
              echo "Ei muutoksia."
              exit 0
            fi
            git commit -m "Päivitä ottelun tulos"

            if git push origin HEAD:main; then
              echo "Tallennettu."
              exit 0
            fi
            echo "Tallennus epäonnistui."
          done

          echo "Tallennus ei onnistunut neljällä yrityksellä. GitHubissa voi olla häiriö (githubstatus.com)."
          exit 1
