name: Päivitä Capitalsin tulos

on:
  # Varsinaiset haut käynnistää cron-job.org kymmenen minuutin välein klo 4–10.
  # GitHubin oma ajastus on varmistus siltä varalta, että cron-job.org ei toimi.
  schedule:
    - cron: "15 7 * * *"
      timezone: "Europe/Helsinki"
  workflow_dispatch: # cron-job.org, sovelluksen "Hae tulos" -nappi ja Actions-välilehden Run workflow
    inputs:
      testi:
        description: "Lähetä testi-ilmoitus puhelimiin"
        type: boolean
        default: false

permissions:
  contents: write

# Jos hakuja käynnistyy useita peräkkäin, ne jonottavat eivätkä riitele keskenään.
concurrency:
  group: paivita
  cancel-in-progress: false

jobs:
  paivita:
    runs-on: ubuntu-latest
    env:
      ILMOITUS_TIEDOSTO: /tmp/capitals-ilmoitus.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Hae tulos ja tallenna repoon
        id: haku
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Jos GitHub on hetkellisesti häiriössä tai toinen haku ehti tallentaa ensin,
          # yritetään uudelleen enintään neljä kertaa (odotus 10 s, 20 s ja 30 s).
          for yritys in 1 2 3 4; do
            if [ "$yritys" -gt 1 ]; then
              echo "Yritetään uudelleen ($yritys/4)…"
              sleep $(( (yritys - 1) * 10 ))
            fi
            rm -f "$ILMOITUS_TIEDOSTO"

            # Aloitetaan aina repon tuoreimmasta versiosta
            git fetch origin main || continue
            git reset --hard origin/main

            node scripts/paivita.mjs
            git add data/tulos.json
            if git diff --cached --quiet; then
              echo "Ei muutoksia."
              exit 0
            fi
            git commit -m "Päivitä ottelun tulos"

            if git push origin HEAD:main; then
              echo "Tallennettu."
              # Ilmoitus lähetetään vain, jos tämä haku tallensi uuden ottelun
              if [ -f "$ILMOITUS_TIEDOSTO" ]; then echo "ilmoita=true" >> "$GITHUB_OUTPUT"; fi
              exit 0
            fi
            echo "Tallennus epäonnistui."
          done

          echo "Tallennus ei onnistunut neljällä yrityksellä. GitHubissa voi olla häiriö (githubstatus.com)."
          exit 1

      - name: Valmistele testi-ilmoitus
        if: inputs.testi
        run: |
          echo '{"otsikko":"Capitals – testi-ilmoitus","teksti":"Ilmoitukset toimivat 👍","ottelu":"testi"}' > "$ILMOITUS_TIEDOSTO"

      - name: Lähetä push-ilmoitus
        if: steps.haku.outputs.ilmoita == 'true' || inputs.testi
        # Ilmoituksen epäonnistuminen ei kaada hakua: tulos on jo tallessa ja näkyy sovelluksessa.
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund web-push firebase-admin > /dev/null
          node scripts/ilmoita.mjs
