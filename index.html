<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#041E42">
<title>Capitals – voitto vai häviö?</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="kuvakkeet/ikoni-192.png">
<link rel="apple-touch-icon" href="kuvakkeet/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Capitals">
<style>
  :root {
    --navy: #041E42;
    --navy-2: #0A2A5C;
    --red: #C8102E;
    --white: #FFFFFF;
    --silver: #A2AAAD;
  }
  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: var(--white);
    background: var(--navy) radial-gradient(120% 80% at 50% 0%, var(--navy-2), var(--navy) 60%) no-repeat;
    overflow-x: hidden;
  }

  /* Punavalkoiset raidat yläreunassa */
  .raidat {
    height: 14px;
    background: repeating-linear-gradient(90deg, var(--red) 0 28px, var(--white) 28px 56px);
  }

  .vesileima {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    pointer-events: none; z-index: 0;
  }
  .vesileima img { width: min(85vw, 560px); opacity: .07; filter: grayscale(.2); }

  main {
    position: relative; z-index: 1;
    min-height: calc(100% - 14px);
    display: flex; flex-direction: column; align-items: center;
    padding: 28px 20px 0; text-align: center;
  }

  .otsikko { letter-spacing: .35em; font-size: .8rem; font-weight: 700; color: var(--silver); }
  .tahdet { color: var(--red); letter-spacing: .5em; margin: 6px 0 0 .5em; font-size: 1rem; }

  .tunniste { margin-top: 28px; font-size: 1rem; font-weight: 600; text-transform: uppercase; letter-spacing: .15em; }
  .pvm { margin-top: 4px; color: var(--silver); font-size: .95rem; }

  .ottelu {
    margin-top: 26px;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 12px;
    width: min(100%, 520px);
  }
  .joukkue { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .logo {
    width: 92px; height: 92px; border-radius: 50%;
    background: rgba(255,255,255,.95);
    display: grid; place-items: center; overflow: hidden;
    box-shadow: 0 6px 24px rgba(0,0,0,.35);
  }
  .logo img { width: 80%; height: 80%; object-fit: contain; }
  .logo span { color: var(--navy); font-weight: 800; font-size: 1.4rem; }
  .joukkue.oma .logo { outline: 3px solid var(--red); outline-offset: 3px; }
  .nimi { font-weight: 700; font-size: 1rem; line-height: 1.2; }
  .rooli { font-size: .72rem; color: var(--silver); text-transform: uppercase; letter-spacing: .15em; }
  .vs { margin-top: 36px; font-weight: 800; color: var(--silver); font-size: 1.1rem; }

  .tulos {
    margin-top: 34px;
    font-size: clamp(3.6rem, 17vw, 7rem);
    font-weight: 900; letter-spacing: .04em; line-height: 1;
    padding: 18px 34px 22px; border-radius: 18px;
  }
  .tulos.voitto {
    background: var(--red); color: var(--white);
    box-shadow: 0 0 0 4px var(--white), 0 0 0 8px var(--red), 0 16px 50px rgba(200,16,46,.45);
  }
  .tulos.havio {
    background: transparent; color: var(--silver);
    border: 3px solid rgba(162,170,173,.5);
  }
  .lisatieto { margin-top: 14px; color: var(--silver); font-size: .9rem; min-height: 1.2em; }

  .tulos.kaynnissa {
    font-size: clamp(2.4rem, 11vw, 4.6rem);
    color: var(--white); border: 3px solid var(--white);
    display: flex; align-items: center; gap: 18px;
  }
  .pallo {
    width: .38em; height: .38em; border-radius: 50%; background: var(--red); flex: none;
    box-shadow: 0 0 0 0 rgba(200,16,46,.7); animation: syke 1.6s infinite;
  }
  @keyframes syke {
    0% { box-shadow: 0 0 0 0 rgba(200,16,46,.7); }
    70% { box-shadow: 0 0 0 .35em rgba(200,16,46,0); }
    100% { box-shadow: 0 0 0 0 rgba(200,16,46,0); }
  }

  .sarja, .seuraava {
    margin: 14px auto 0; width: min(100%, 420px);
    padding: 12px 16px; border-radius: 12px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
    font-size: .95rem; line-height: 1.35;
  }
  .sarja { border-color: rgba(200,16,46,.7); font-weight: 700; }
  .sarja span, .seuraava span {
    display: block; font-size: .7rem; font-weight: 600; letter-spacing: .15em;
    text-transform: uppercase; color: var(--silver); margin-bottom: 3px;
  }
  .sarja + .seuraava { margin-top: 10px; }

  .viesti { margin-top: 60px; color: var(--silver); }

  .toiminnot { margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .nappi {
    font: inherit; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--white); background: transparent;
    border: 2px solid var(--white); border-radius: 999px;
    padding: 12px 28px; cursor: pointer;
  }
  .nappi:active { transform: scale(.97); }
  .nappi:disabled { opacity: .5; cursor: default; }
  .tila { color: var(--silver); font-size: .85rem; min-height: 1.2em; }
  .haettu { color: var(--silver); font-size: .78rem; opacity: .85; }
  .pieninappi {
    font: inherit; font-size: .85rem; color: var(--white);
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px; padding: 8px 16px; cursor: pointer; margin-top: 6px;
  }
  .pieninappi.paalla { border-color: var(--red); background: rgba(200,16,46,.18); }
  .pieninappi:disabled { opacity: .55; cursor: default; }
  .asetuslinkki { background: none; border: 0; color: var(--silver); font: inherit; font-size: .8rem; text-decoration: underline; cursor: pointer; }

  .asetukset {
    margin-top: 6px; width: min(100%, 380px); text-align: left;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.15);
    border-radius: 14px; padding: 16px; display: grid; gap: 10px;
  }
  .asetukset label { font-size: .8rem; color: var(--silver); display: grid; gap: 4px; }
  .asetukset input {
    font: inherit; font-size: .95rem; padding: 9px 10px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.25); color: var(--white);
  }
  .asetukset .rivi { display: flex; gap: 8px; justify-content: flex-end; }
  .asetukset .ohje { font-size: .78rem; color: var(--silver); line-height: 1.4; }

  .paivitys {
    position: fixed; z-index: 10; left: 50%; bottom: 20px; transform: translateX(-50%);
    width: min(calc(100% - 32px), 420px);
    background: var(--white); color: var(--navy);
    border-radius: 16px; padding: 16px 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
    border-top: 6px solid var(--red);
  }
  .paivitys p { line-height: 1.4; }
  .paivitys .rivi { display: flex; justify-content: flex-end; align-items: center; gap: 14px; margin-top: 12px; }
  .paivitys .asetuslinkki { color: #555; font-size: .9rem; }
  .nappi.punainen { background: var(--red); border-color: var(--red); padding: 10px 24px; }

  .siluetti { margin: auto -20px 0; width: calc(100% + 40px); padding-top: 40px; }
  .siluetti svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>

<div class="paivitys" id="paivitys" role="dialog" aria-live="polite" hidden>
  <p><strong>Sovellukseen on tullut päivitys.</strong><br>Päivitetäänkö nyt?</p>
  <div class="rivi">
    <button class="asetuslinkki" id="myohemminNappi">Myöhemmin</button>
    <button class="nappi punainen" id="paivitaNappi">Päivitä</button>
  </div>
</div>
<div class="vesileima" id="vesileima" hidden><img alt=""></div>

<main>
  <div class="otsikko">WASHINGTON CAPITALS</div>
  <div class="tahdet">★ ★ ★</div>

  <div id="sisalto"><p class="viesti">Ladataan…</p></div>

  <div class="toiminnot">
    <button class="nappi" id="haeNappi">Hae tulos</button>
    <div class="tila" id="tila"></div>
    <div class="haettu" id="haettu"></div>
    <button class="pieninappi" id="ilmoitusNappi" hidden>🔔 Ilmoitukset pois</button>
    <button class="asetuslinkki" id="asetusLinkki">Asetukset</button>
    <form class="asetukset" id="asetukset" hidden>
      <label>GitHub-käyttäjänimi <input id="aOmistaja" autocomplete="off"></label>

      <label>GitHub-token <input id="aToken" type="password" autocomplete="off" placeholder="github_pat_…"></label>

      <div class="rivi">

  <!-- Washingtonin maamerkkejä: Lincoln Memorial, Washington Monument, Jefferson Memorial ja Capitol -->

</main>

<script>
  const OMA = "WSH";

  // ---------- Push-ilmoitusten asetukset ----------
  // VAPID-avaimen julkinen osa (yksityinen osa on GitHubin Secrets-kohdassa).
  // Firebase-tiedot: Capitals-sovelluksen OMA Firebase-projekti (ei veikkaussovelluksen).
  // Jos Firebase-tiedot puuttuvat, ilmoituskytkin ei näy.
  const ILMOITUKSET = {
    vapidJulkinen: "BIIBlhcE831-inuC8CralTKTT7SVzfvUIfXTxd5fQd8cs9o6mI2J9auGn2IOor5fUHml4SSKNO1x0QfJQd9olro",
    firebaseProjekti: "capitals-tulos",
    firebaseApiAvain: "AIzaSyDKpR73f_5SZtWEBeG7Ru8gNLFihXJ2s4o",
  };
  const sisalto = document.getElementById("sisalto");

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function joukkueHtml(j, rooli) {
    const oma = j.lyhenne === OMA ? " oma" : "";
    return `<div class="joukkue${oma}">
        <div class="logo"><img src="${esc(j.logo)}" alt="${esc(j.nimi)}"
          onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${esc(j.lyhenne)}'}))"></div>
        <div class="nimi">${esc(j.nimi)}</div>
        <div class="rooli">${rooli}</div>
      </div>`;
  }

  // Ottelupäivä paikallisessa Washingtonin ajassa, kuten NHL sen ilmoittaa
  const nhlPaiva = (iso) => new Date(iso).toLocaleDateString("fi-FI", { weekday: "short", day: "numeric", month: "numeric", year: "numeric", timeZone: "America/New_York" });
  // Suomen aika: "to 6.11. klo 2.00"
  function suomenAika(iso) {
    const d = new Date(iso);
    const pv = d.toLocaleDateString("fi-FI", { weekday: "short", day: "numeric", month: "numeric", timeZone: "Europe/Helsinki" });
    const klo = d.toLocaleTimeString("fi-FI", { hour: "numeric", minute: "2-digit", timeZone: "Europe/Helsinki" });
    return `${pv} klo ${klo}`;
  }
  const vastustaja = (o) => (o.koti.lyhenne === OMA ? o.vieras : o.koti);

  function asetaVesileima(o) {
    const capsLogo = [o.koti, o.vieras].find((j) => j.lyhenne === OMA)?.logo;
    if (!capsLogo) return;
    const v = document.getElementById("vesileima");
    v.querySelector("img").src = capsLogo;
    v.querySelector("img").onerror = () => (v.hidden = true);
    v.hidden = false;
  }

  function otteluHtml(o) {
    return `<div class="ottelu">
        ${joukkueHtml(o.koti, "Koti")}
        <div class="vs">–</div>
        ${joukkueHtml(o.vieras, "Vieras")}
      </div>`;
  }

  function sarjaHtml(s) {
    if (!s) return "";
    const v = s.voitot, t = s.tappiot, nimi = esc(s.vastustaja);
    let teksti;
    if (v === 4) teksti = `Capitals voitti sarjan ${v}–${t}`;
    else if (t === 4) teksti = `${nimi} voitti sarjan ${t}–${v}`;
    else if (v > t) teksti = `Capitals johtaa ${v}–${t}`;
    else if (t > v) teksti = `${nimi} johtaa ${t}–${v}`;
    else if (v === 0) teksti = `Sarja ${nimi} vastaan alkaa`;
    else teksti = `Sarja tasan ${v}–${t}`;
    return `<div class="sarja"><span>Pudotuspelisarja</span>${teksti}</div>`;
  }

  function seuraavaHtml(s) {
    if (!s) return "";
    const vast = vastustaja(s);
    const missa = s.koti.lyhenne === OMA ? "kotona" : "vieraissa";
    if (new Date(s.alkoi) <= Date.now()) {
      return `<div class="seuraava">Ottelu ${esc(vast.nimi)} vastaan alkoi ${esc(suomenAika(s.alkoi))}. Paina Hae tulos, niin näet tilanteen.</div>`;
    }
    return `<div class="seuraava"><span>Seuraava</span>${esc(suomenAika(s.alkoi))} · ${esc(vast.nimi)}, ${missa}${s.pudotuspeli ? " · Pudotuspelit" : ""}</div>`;
  }

  // Käynnissä oleva ottelu näytetään enintään 6 tuntia alkamisesta (vanhentunut tieto ohitetaan)
  const onKaynnissa = (data) => data?.kaynnissa && Date.now() - new Date(data.kaynnissa.alkoi) < 6 * 36e5;

  // "Tiedot haettu tänään klo 9.30" (Suomen aikaa)
  function naytaHakuaika(iso) {
    const el = document.getElementById("haettu");
    if (!iso) { el.textContent = ""; return; }
    const d = new Date(iso);
    const paiva = (x) => x.toLocaleDateString("fi-FI", { timeZone: "Europe/Helsinki" });
    const nyt = new Date();
    const eilen = new Date(nyt.getTime() - 864e5);
    const klo = d.toLocaleTimeString("fi-FI", { hour: "numeric", minute: "2-digit", timeZone: "Europe/Helsinki" });
    let milloin;
    if (paiva(d) === paiva(nyt)) milloin = "tänään";
    else if (paiva(d) === paiva(eilen)) milloin = "eilen";
    else milloin = d.toLocaleDateString("fi-FI", { weekday: "short", day: "numeric", month: "numeric", timeZone: "Europe/Helsinki" });
    el.textContent = `Tiedot haettu ${milloin} klo ${klo}`;
  }

  function nayta(data) {
    if (onKaynnissa(data)) {
      const k = data.kaynnissa;
      nykyinenId = `live-${k.id}`;
      asetaVesileima(k);
      sisalto.innerHTML = `
        <div class="tunniste">Ottelu käynnissä</div>
        <div class="pvm">${esc(nhlPaiva(k.alkoi))}${k.pudotuspeli ? " · Pudotuspelit" : ""}</div>
        ${otteluHtml(k)}
        <div class="tulos kaynnissa"><i class="pallo"></i>KÄYNNISSÄ</div>
        <div class="lisatieto">${k.areena ? esc(k.areena) : ""}</div>
        ${sarjaHtml(data.sarja)}
        ${seuraavaHtml(data.seuraava)}`;
      document.title = "Capitals – ottelu käynnissä";
      return;
    }

    if (!data || !data.ottelu || !data.tulos) {
      nykyinenId = null;
      sisalto.innerHTML = `<p class="viesti">Ei vielä pelattuja otteluita.</p>${seuraavaHtml(data?.seuraava)}`;
      return;
    }
    const o = data.ottelu;
    nykyinenId = o.id;
    const tuntiaSitten = (Date.now() - new Date(o.alkoi)) / 36e5;
    const tunniste = tuntiaSitten < 24 ? "Yön ottelu" : "Edellinen ottelu";
    const voitto = data.tulos === "VOITTO";
    asetaVesileima(o);

    sisalto.innerHTML = `
      <div class="tunniste">${tunniste}</div>
      <div class="pvm">${esc(nhlPaiva(o.alkoi))}${o.pudotuspeli ? " · Pudotuspelit" : ""}</div>
      ${otteluHtml(o)}
      <div class="tulos ${voitto ? "voitto" : "havio"}">${voitto ? "VOITTO" : "HÄVIÖ"}</div>
      <div class="lisatieto">${o.areena ? esc(o.areena) : ""}</div>
      ${sarjaHtml(data.sarja)}
      ${seuraavaHtml(data.seuraava)}`;
    document.title = `Capitals – ${voitto ? "voitto" : "häviö"}`;
  }

  // ---------- Asetukset (tallentuvat vain tähän laitteeseen) ----------
  const AVAIN = "capsTulosAsetukset";
  function oletukset() {
    // https://kayttaja.github.io/repo/ → kayttaja + repo
    const h = location.hostname;
    if (!h.endsWith(".github.io")) return { omistaja: "", repo: "" };
    return { omistaja: h.split(".")[0], repo: location.pathname.split("/").filter(Boolean)[0] || "" };
  }
  function asetukset() {
    let tallennetut = {};
    try { tallennetut = JSON.parse(localStorage.getItem(AVAIN)) || {}; } catch {}
    const o = oletukset();
    return { omistaja: tallennetut.omistaja || o.omistaja, repo: tallennetut.repo || o.repo, token: tallennetut.token || "" };
  }
  const valmis = (a) => a.omistaja && a.repo && a.token;

  const lomake = document.getElementById("asetukset");
  function avaaAsetukset() {
    const a = asetukset();
    document.getElementById("aOmistaja").value = a.omistaja;
    document.getElementById("aRepo").value = a.repo;
    document.getElementById("aToken").value = a.token;
    lomake.hidden = false;
  }
  document.getElementById("asetusLinkki").onclick = () => (lomake.hidden ? avaaAsetukset() : (lomake.hidden = true));
  document.getElementById("aPeru").onclick = () => (lomake.hidden = true);
  lomake.onsubmit = (e) => {
    e.preventDefault();
    const uudet = {
      omistaja: document.getElementById("aOmistaja").value.trim(),
      repo: document.getElementById("aRepo").value.trim(),
      token: document.getElementById("aToken").value.trim(),
    };
    try { localStorage.setItem(AVAIN, JSON.stringify(uudet)); } catch {
      return asetaTila("Asetuksia ei voitu tallentaa tähän selaimeen.");
    }
    lomake.hidden = true;
    asetaTila("Asetukset tallennettu.");
  };

  // ---------- GitHub ----------
  function gh(polku, valinnat = {}) {
    const a = asetukset();
    return fetch(`https://api.github.com/repos/${encodeURIComponent(a.omistaja)}/${encodeURIComponent(a.repo)}${polku}`, {
      ...valinnat,
      cache: "no-store",
      headers: {
        Accept: "application/vnd.github+json",
        Authorization: `Bearer ${a.token}`,
        "X-GitHub-Api-Version": "2022-11-28",
        ...(valinnat.headers || {}),
      },
    });
  }

  async function lataaTulos() {
    // Tokenin kanssa luetaan suoraan repon tuorein versio (ei odotella Pages-sivun päivittymistä)
    if (valmis(asetukset())) {
      try {
        const r = await gh("/contents/data/tulos.json", { headers: { Accept: "application/vnd.github.raw+json" } });
        if (r.ok) return await r.json();
      } catch {}
    }
    const r = await fetch(`data/tulos.json?t=${Date.now()}`, { cache: "no-store" });
    return r.json();
  }

  // ---------- Hae tulos -nappi ----------
  const nappi = document.getElementById("haeNappi");
  const asetaTila = (t) => (document.getElementById("tila").textContent = t);
  const odota = (ms) => new Promise((r) => setTimeout(r, ms));
  let nykyinenId = null;

  async function haeNyt() {
    if (!valmis(asetukset())) {
      asetaTila("Lisää ensin GitHub-token asetuksiin.");
      return avaaAsetukset();
    }
    nappi.disabled = true;
    const aloitettu = Date.now();
    try {
      asetaTila("Käynnistetään haku…");
      const r = await gh("/actions/workflows/paivita.yml/dispatches", {
        method: "POST",
        body: JSON.stringify({ ref: "main" }),
      });
      if (r.status === 401) throw new Error("Token ei kelpaa. Tarkista asetukset.");
      if (r.status === 403 || r.status === 404) throw new Error("Ei oikeutta tai repoa ei löydy. Tarkista käyttäjänimi, repo ja tokenin oikeudet.");
      if (!r.ok) throw new Error(`GitHub vastasi virheellä ${r.status}.`);

      // Odotetaan, että ajo valmistuu (yleensä 20–60 s)
      for (let i = 0; i < 60; i++) {
        await odota(4000);
        const vastaus = await gh("/actions/workflows/paivita.yml/runs?event=workflow_dispatch&per_page=1");
        const ajo = vastaus.ok ? (await vastaus.json()).workflow_runs?.[0] : null;
        if (!ajo || new Date(ajo.created_at).getTime() < aloitettu - 15000) {
          asetaTila("Odotetaan GitHubia…");
          continue;
        }
        if (ajo.status !== "completed") {
          asetaTila(`Haetaan tulosta NHL:stä… (${Math.round((Date.now() - aloitettu) / 1000)} s)`);
          continue;
        }
        if (ajo.conclusion !== "success") throw new Error("Haku epäonnistui. Katso lisätiedot GitHubin Actions-välilehdeltä.");
        naytaHakuaika(ajo.updated_at);
        const data = await lataaTulos();
        const ennen = nykyinenId;
        nayta(data);
        if (onKaynnissa(data)) asetaTila("Ottelu on käynnissä. Hae tulos uudelleen ottelun jälkeen.");
        else asetaTila(nykyinenId !== ennen ? "Tulos päivitetty." : "Ei uutta ottelua. Näytetään viimeisin.");
        return;
      }
      throw new Error("Haku kesti liian kauan. Yritä hetken päästä uudelleen.");
    } catch (e) {
      asetaTila(e.message || "Haku epäonnistui.");
    } finally {
      nappi.disabled = false;
    }
  }
  nappi.onclick = haeNyt;

  // ---------- Asennettava sovellus ----------
  // Kun GitHubiin tulee uusi versio, sovellus kysyy "Päivitetäänkö?". Päivitä-napin jälkeen sivu latautuu uutena.
  if ("serviceWorker" in navigator) {
    let paivitysPyydetty = false;
    const palkki = document.getElementById("paivitys");

    function tarjoaPaivitys(odottava) {
      palkki.hidden = false;
      document.getElementById("paivitaNappi").onclick = () => {
        paivitysPyydetty = true;
        document.getElementById("paivitaNappi").disabled = true;
        document.getElementById("paivitaNappi").textContent = "Päivitetään…";
        odottava.postMessage("PAIVITA");
      };
      document.getElementById("myohemminNappi").onclick = () => (palkki.hidden = true);
    }

    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (paivitysPyydetty) location.reload();
    });

    navigator.serviceWorker.register("sw.js").then((reg) => {
      // Uusi versio odottaa jo valmiina (ladattu edellisellä kerralla)
      if (reg.waiting && navigator.serviceWorker.controller) tarjoaPaivitys(reg.waiting);
      // Uusi versio löytyy nyt
      reg.addEventListener("updatefound", () => {
        const uusi = reg.installing;
        uusi?.addEventListener("statechange", () => {
          if (uusi.state === "installed" && navigator.serviceWorker.controller) tarjoaPaivitys(uusi);
        });
      });
      // Tarkistetaan päivitykset myös, kun sovellus palaa taustalta näkyviin
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") reg.update().catch(() => {});
      });
    }).catch(() => {});
  }

  // ---------- Viimeisin hakuaika GitHubista ----------
  // Tulostiedosto tallennetaan vain, kun tieto muuttuu, joten hakuaika luetaan GitHubin onnistuneista hauista.
  async function paivitaHakuaika() {
    const a = asetukset();
    if (!a.omistaja || !a.repo) return;
    const polku = "/actions/workflows/paivita.yml/runs?status=success&per_page=1";
    try {
      const r = valmis(a)
        ? await gh(polku)
        : await fetch(`https://api.github.com/repos/${encodeURIComponent(a.omistaja)}/${encodeURIComponent(a.repo)}${polku}`, {
            headers: { Accept: "application/vnd.github+json" }, cache: "no-store",
          });
      if (!r.ok) return;
      const ajo = (await r.json()).workflow_runs?.[0];
      if (ajo) naytaHakuaika(ajo.updated_at);
    } catch {}
  }

  // ---------- Push-ilmoitukset ----------
  const ilmoitusNappi = document.getElementById("ilmoitusNappi");
  const ilmoituksetKaytossa = () =>
    ILMOITUKSET.firebaseProjekti && "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;

  async function tilausTunniste(endpoint) {
    const tiiviste = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(endpoint));
    return [...new Uint8Array(tiiviste)].map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  async function firestoreOsoite(endpoint) {
    const avain = ILMOITUKSET.firebaseApiAvain ? `?key=${encodeURIComponent(ILMOITUKSET.firebaseApiAvain)}` : "";
    return `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(ILMOITUKSET.firebaseProjekti)}` +
      `/databases/(default)/documents/tilaukset/${await tilausTunniste(endpoint)}${avain}`;
  }
  async function tallennaTilaus(tilaus) {
    const r = await fetch(await firestoreOsoite(tilaus.endpoint), {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fields: {
        sub: { stringValue: JSON.stringify(tilaus.toJSON()) },
        paivitetty: { timestampValue: new Date().toISOString() },
      } }),
    });
    if (!r.ok) throw new Error(`Firebase vastasi ${r.status}`);
  }
  async function poistaTilaus(tilaus) {
    await fetch(await firestoreOsoite(tilaus.endpoint), { method: "DELETE" }).catch(() => {});
  }
  function vapidAvain() {
    const b64 = ILMOITUKSET.vapidJulkinen.replace(/-/g, "+").replace(/_/g, "/");
    const raaka = atob(b64 + "=".repeat((4 - (b64.length % 4)) % 4));
    return Uint8Array.from(raaka, (c) => c.charCodeAt(0));
  }

  function naytaIlmoitusTila(paalla) {
    ilmoitusNappi.hidden = false;
    if (Notification.permission === "denied") {
      ilmoitusNappi.textContent = "🔕 Ilmoitukset estetty puhelimen asetuksista";
      ilmoitusNappi.disabled = true;
      ilmoitusNappi.classList.remove("paalla");
      return;
    }
    ilmoitusNappi.disabled = false;
    ilmoitusNappi.textContent = paalla ? "🔔 Ilmoitukset päällä" : "🔕 Ilmoitukset pois";
    ilmoitusNappi.classList.toggle("paalla", paalla);
  }

  async function alustaIlmoitukset() {
    if (!ilmoituksetKaytossa()) return;
    const reg = await navigator.serviceWorker.ready;
    let tilaus = await reg.pushManager.getSubscription();
    const paalla = !!tilaus && Notification.permission === "granted";
    naytaIlmoitusTila(paalla);
    // Tallennetaan tilaus uudelleen joka avauskerralla, jotta Firebasessa on aina puhelimen ajantasainen osoite.
    if (paalla) tallennaTilaus(tilaus).catch(() => {});

    ilmoitusNappi.onclick = async () => {
      ilmoitusNappi.disabled = true;
      try {
        tilaus = await reg.pushManager.getSubscription();
        if (tilaus && Notification.permission === "granted") {
          await poistaTilaus(tilaus);
          await tilaus.unsubscribe();
          naytaIlmoitusTila(false);
          asetaTila("Ilmoitukset poistettu käytöstä.");
          return;
        }
        const lupa = await Notification.requestPermission();
        if (lupa !== "granted") { naytaIlmoitusTila(false); asetaTila("Ilmoituksille ei annettu lupaa."); return; }
        tilaus = tilaus || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: vapidAvain() });
        await tallennaTilaus(tilaus);
        naytaIlmoitusTila(true);
        asetaTila("Ilmoitukset päällä. Saat äänettömän ilmoituksen, kun uusi ottelu on päättynyt.");
      } catch (e) {
        naytaIlmoitusTila(false);
        asetaTila(`Ilmoitusten käyttöönotto epäonnistui. ${e.message || ""}`.trim());
      } finally {
        if (Notification.permission !== "denied") ilmoitusNappi.disabled = false;
      }
    };
  }

  // ---------- Käynnistys ----------
  function lataaJaNayta() {
    return lataaTulos()
      .then(nayta)
      .catch(() => (sisalto.innerHTML = `<p class="viesti">Tulosta ei saatu ladattua. Yritä hetken päästä uudelleen.</p>`));
  }
  lataaJaNayta();
  paivitaHakuaika();
  alustaIlmoitukset().catch(() => {});

  // Kun sovellus palaa taustalta näkyviin (esim. ilmoituksen napautuksesta), haetaan tuoreet tiedot.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && !nappi.disabled) { lataaJaNayta(); paivitaHakuaika(); }
  });
</script>
</body>
</html>
